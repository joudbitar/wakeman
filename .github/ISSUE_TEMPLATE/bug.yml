name: Bug report
description: Something broke or behaved wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running wakeman
      options:
        - npx wakeman / installed wakeman (background service)
        - a checkout run in place (the dev install)
        - other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: node -v
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "npx path: ~/.local/state/wakeman/logs. Installed path: logs/ inside the checkout, or `wakeman logs <project>`."
      render: text
